services:
  - type: web
    name: mini-erp-crm-backend
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: USE_IN_MEMORY_DB
        value: true
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "https://opti-erp.vercel.app"
