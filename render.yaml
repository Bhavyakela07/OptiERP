services:
  - type: web
    name: optierp-backend
    env: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run seed && node dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: USE_IN_MEMORY_DB
        value: true
      - key: JWT_SECRET
        value: super-secret-jwt-key-for-mini-erp-crm-2026
      - key: CORS_ORIGIN
        value: '*'
      - key: ADMIN_EMAIL
        value: admin@company.com
      - key: ADMIN_PASSWORD
        value: 123456
      - key: ADMIN_NAME
        value: Admin User
